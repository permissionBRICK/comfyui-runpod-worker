name: Build worker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker build --progress=plain -t ghcr.io/permissionbrick/comfyui-runpod-worker:latest .
      - name: Push
        run: docker push ghcr.io/permissionbrick/comfyui-runpod-worker:latest
