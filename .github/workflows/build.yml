name: Build worker image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also publish the tested image as latest
        required: false
        type: boolean
        default: false

env:
  GHCR: ghcr.io/permissionbrick/comfyui-runpod-worker
  HUB: docker.io/permissionbrick/comfyui-runpod-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (base image needs ~30GB scratch)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub copy: RunPod hosts pulled ghcr at 40-62 MB/s even on
      # 6-7 Gbit uplinks, Docker Hub images at ~280 MB/s (2026-10-16 probe).
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push candidate (gzip layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR }}:cuda13-candidate
            ${{ env.GHCR }}:${{ github.sha }}
            ${{ env.HUB }}:cuda13-candidate
            ${{ env.HUB }}:${{ github.sha }}
      - name: Publish tested image as latest
        if: github.event_name == 'workflow_dispatch' && inputs.publish_latest
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}:latest -t ${{ env.HUB }}:latest \
            ${{ env.GHCR }}:cuda13-candidate
