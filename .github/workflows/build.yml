name: Build worker image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also publish the tested image as latest
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (base image needs ~30GB scratch)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        run: |
          docker build --progress=plain \
            -t ghcr.io/permissionbrick/comfyui-runpod-worker:cuda13-candidate \
            -t ghcr.io/permissionbrick/comfyui-runpod-worker:${GITHUB_SHA} .
      - name: Push candidate
        run: |
          docker push ghcr.io/permissionbrick/comfyui-runpod-worker:cuda13-candidate
          docker push ghcr.io/permissionbrick/comfyui-runpod-worker:${GITHUB_SHA}
      - name: Publish tested image as latest
        if: github.event_name == 'workflow_dispatch' && inputs.publish_latest
        run: |
          docker tag ghcr.io/permissionbrick/comfyui-runpod-worker:cuda13-candidate \
            ghcr.io/permissionbrick/comfyui-runpod-worker:latest
          docker push ghcr.io/permissionbrick/comfyui-runpod-worker:latest
